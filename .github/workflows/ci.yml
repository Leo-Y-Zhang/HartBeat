name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stable, and the minimum the manifest claims. A crate that says
        # rust-version = "1.74" and has never been built with it is guessing.
        rust: [stable, "1.74.0"]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: rustup default ${{ matrix.rust }}
      - run: cargo test --release

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets -- -D warnings

  guests:
    name: Rebuild the guest images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add riscv32im-unknown-none-elf

      # The committed images are what the tests normally run. This rebuilds them
      # from source with the runner's toolchain and runs the tests against the
      # fresh ones, so the pipeline from Rust source to executed RISC-V is
      # checked as well as the fixed workload. Byte-identity is not required:
      # a different rustc selects different instructions, which is the point of
      # committing them.
      - run: sh tools/build-guests.sh
      - run: cargo test --release --test programs
      - name: Report whether the rebuild changed the images
        run: git diff --stat -- fixtures/ || true

  mutations:
    name: Mutation evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal

      # Breaks the emulator twelve ways on hardware that is not the author's and
      # fails if the result differs from what is committed.
      - run: python3 tools/mutations.py
      - name: The committed evidence must match
        run: git diff --exit-code -- MUTATIONS.md

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pinned binary over the whole history, not the action: the action
      # scans only the pushed range, so a secret committed once and never touched
      # again is invisible to it, and on a repository's first push it fails
      # outright because the root commit has no parent.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
